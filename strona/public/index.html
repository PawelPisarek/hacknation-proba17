<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prześwit — MVP</title>
<style>
  :root { --tlo: #f4f6f9; --karta: #fff; --linia: #d5dbe3; --tekst: #1a2230; --szary: #5b6678; --akc: #1b5fb8; --blad: #b3261e; --ok: #1e7b34; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--tlo); color: var(--tekst); }
  .pasek-sztuczne { background: #fff3d6; color: #734900; border-bottom: 1px solid #ecc97e; padding: 5px 14px; font-size: 12px; font-weight: 600; text-align: center; }
  main { max-width: 1280px; margin: 0 auto; padding: 12px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .przyciski { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .przyciski button, label.przycisk { padding: 8px 14px; border: 1px solid var(--akc); border-radius: 6px; background: var(--karta); color: var(--akc); font: inherit; cursor: pointer; }
  input[type=file] { display: none; }
  #karta.ok { color: var(--ok); } #karta.zle, .blad { color: var(--blad); }
  .tabela { overflow-x: auto; background: var(--karta); border: 1px solid var(--linia); border-radius: 8px; margin-bottom: 12px; }
  .tabela table { border-collapse: collapse; width: 100%; font-size: 14px; }
  .tabela th, .tabela td { border-bottom: 1px solid var(--linia); padding: 6px 8px; text-align: left; vertical-align: top; }
  .tabela tbody tr { cursor: pointer; }
  .tabela tbody tr:hover { background: #f0f6ff; }
  .tabela tbody tr.otwarte { background: #e6eef9; font-weight: 600; }
  #widok:empty { display: none; }
  small { opacity: .75; }
*{box-sizing:border-box}
.pasek-auta{background:var(--karta);border:1px solid var(--linia);border-radius:8px 8px 0 0;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.auto-tytul b{font-size:16px;margin-right:8px}
.auto-tytul .plik{font-size:13px;color:var(--szary);font-family:ui-monospace,monospace}
.auto-meta{display:flex;gap:8px;align-items:center;font-size:13px}
.tag-rodzaj{background:#e6eef9;color:#124486;padding:3px 10px;border-radius:999px;font-weight:600}
.tag-miejsca{color:var(--szary)}
.dwa{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;background:#1c1f24}
.dwa.jeden{grid-template-columns:1fr}
.dwa>*{min-width:0}
.panel-obr h3{margin:0 0 6px;font-size:12px;letter-spacing:.04em;color:#d6dce6;font-weight:600;display:flex;gap:8px;align-items:center}
.panel-obr .podtytul{font-weight:400;color:#9aa5b6;font-family:ui-monospace,monospace;font-size:11px}
.scena{position:relative;background:#000;border-radius:4px;overflow:hidden;line-height:0}
.scena img{width:100%;height:100%;display:block}
.plotno{position:relative;width:100%;height:100%;transform-origin:0 0;--zx:1;--zy:1}
.plotno .ramka,.plotno .ramka-wz{border-left-width:calc(2px / var(--zx));border-right-width:calc(2px / var(--zx));border-top-width:calc(2px / var(--zy));border-bottom-width:calc(2px / var(--zy));box-shadow:none}
.plotno .ramka.akt{border-left-width:calc(3px / var(--zx));border-right-width:calc(3px / var(--zx));border-top-width:calc(3px / var(--zy));border-bottom-width:calc(3px / var(--zy));outline:none;box-shadow:none;border-color:#fff;background:rgba(27,95,184,.18)}
.plotno .ramka span{transform:scale(calc(1 / var(--zx)),calc(1 / var(--zy)));transform-origin:0 100%}
.ramka-wz{position:absolute;border:2px dashed #4dabf7;box-shadow:0 0 0 1px rgba(0,0,0,.6);pointer-events:none}
.przybl button{background:#fff;border:1px solid var(--linia);padding:2px 8px;font-size:12px;cursor:pointer}.przybl button.on{background:var(--akc);color:#fff;border-color:var(--akc)}
.warstwa-ramek{position:absolute;inset:0}
.ramka{position:absolute;padding:0;background:transparent;border:2px solid #f0b429;cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
.ramka.akt{border-width:3px;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--akc);z-index:5}
.ramka span{position:absolute;top:-18px;left:-2px;background:#1a2230;color:#fff;font-size:11px;font-weight:700;line-height:1;padding:2px 5px;border-radius:3px}
.sekcja-listy{background:var(--karta);border:1px solid var(--linia);border-top:0;border-radius:0 0 8px 8px;padding:12px}
.kafle-pasek{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.kaf{flex:0 0 186px;border:2px solid var(--linia);border-radius:6px;padding:6px;cursor:pointer;background:#fff;transition:border-color .15s}
.kaf:hover{border-color:#8db2e3}
.kaf.wyb{border-color:var(--akc);background:#f0f6ff}
.kaf .para{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.kaf .wycinek{height:66px;background-color:#111;background-repeat:no-repeat;border-radius:3px;border:1px solid #cfd6e0}
.kaf .opis{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px}
.kaf .podp{margin-top:4px;padding:3px 6px;border-left:3px solid #1a5bb5;background:#eef4fc;color:#1f2a3a;font-size:12px;line-height:1.3;border-radius:2px}
.kaf .podp.poza{border-left-color:#d98a00;background:#fff4dc}
.badge{padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
.wiecej-pasek{margin-top:10px;padding-top:10px;border-top:1px dashed var(--linia)}
.btn-wiecej{background:#eef3fa;color:#14468c;border:1px solid #b9d0ef;border-radius:6px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer}
.btn-wiecej:hover{background:#dfeaf8}
.wskaz-ciecie{position:absolute;right:6px;top:6px;line-height:16px;font-weight:600;background:rgba(0,0,0,.72);color:#fff;font-size:12px;padding:2px 6px;border-radius:3px;pointer-events:none;z-index:3}
.komunikat{padding:14px 16px;border-radius:6px;font-size:15px;font-weight:600}
.komunikat.brak-wzorca{background:#fff3d6;color:#7a4b00;border:1px solid #e6c278}
.komunikat.brak-wskazan{background:#eef5ff;color:#164178;border:1px solid #b8d1f2}
.stopka{margin:10px 0 18px;font-size:12px;color:var(--szary)}
@media(max-width:760px){.dwa{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="pasek-sztuczne">dane sztuczne — demonstracja</div>
<main>
  <h1>Prześwit — porównanie obrazu RTG z wzorcem</h1>
  <small>Miejsca od najbardziej różnego od wzorca. Kliknij auto na liście, żeby zobaczyć ramki, wzorzec obok i przybliżenie.</small>
  <p id="karta">Sprawdzam kartę…</p>
  <div class="przyciski">
    <label class="przycisk" for="plik">Wskaż obraz .bmp</label>
    <input id="plik" type="file" accept=".bmp">
    <button id="partia" type="button">Partia pokazowa</button>
  </div>
  <p id="stan"></p>
  <div class="tabela" id="tabela" hidden>
    <table>
      <thead><tr><th>#</th><th>plik</th><th>rodzaj</th><th>miejsc</th><th>czas</th></tr></thead>
      <tbody id="wyniki"></tbody>
    </table>
  </div>
  <div id="widok"></div>
</main>
<script src="widok.js"></script>
<script src="strona.js"></script>
</body>
</html>
